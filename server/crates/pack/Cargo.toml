[package]
name = "hako-pack"
version = "0.1.0"
edition.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
aws-config = { version = "1.13.0", default-features = false, features = ["rt-tokio", "rustls"] }
aws-credential-types = "1.3.1"
aws-sdk-s3 = { version = "1.155.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "rustls"] }
base64.workspace = true
bytes = "1"
futures-util = "0.3"
jsonschema = { version = "0.60.1", default-features = false }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tempfile = "3"
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
