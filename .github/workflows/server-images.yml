name: Server images

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: server-images
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check registry credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [[ -z "$REGISTRY_USERNAME" || -z "$REGISTRY_PASSWORD" ]]; then
            echo "REGISTRY_USERNAME and REGISTRY_PASSWORD secrets are required to publish server images." >&2
            exit 1
          fi

      - name: Compute image tag from commit
        run: echo "IMAGE_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to docker.barkfluff.com
        uses: docker/login-action@v3
        with:
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push hako-auth image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: server/Dockerfile
          build-args: |
            SERVICE_PACKAGE=hako-auth
            HEALTHCHECK_PORT=8081
          push: true
          tags: |
            docker.barkfluff.com/hako-auth:latest
            docker.barkfluff.com/hako-auth:sha-${{ env.IMAGE_SHA }}

      - name: Build and push hako-pack image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: server/Dockerfile
          build-args: |
            SERVICE_PACKAGE=hako-pack
            HEALTHCHECK_PORT=8082
          push: true
          tags: |
            docker.barkfluff.com/hako-pack:latest
            docker.barkfluff.com/hako-pack:sha-${{ env.IMAGE_SHA }}
