name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          xcodebuild -project macos/Hako/Hako.xcodeproj -scheme Hako -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build test \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= HAKO_COMMIT="$GITHUB_SHA"

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build Windows app
        run: dotnet build windows/Hako/Hako.csproj -c Debug -p:Platform=x64

      - name: Run tests
        run: dotnet test windows/Hako.Tests/Hako.Tests.csproj -c Debug

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run release script tests
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py'
