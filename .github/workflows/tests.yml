name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          xcodebuild -project macos/Hako/Hako.xcodeproj -scheme Hako -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build test \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= HAKO_COMMIT="$GITHUB_SHA"

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      # aka.ms redirects .NET downloads to a broken origin (HTTP 409); the runner
      # image already ships a .NET 8 SDK, so verify it instead of downloading one.
      - name: Verify .NET 8 SDK
        shell: pwsh
        run: |
          $sdk = dotnet --list-sdks | Where-Object { $_ -match '^8\.0\.' } | Select-Object -Last 1
          if (-not $sdk) { throw 'No .NET 8 SDK found on the runner image.' }
          Write-Output "Using .NET SDK $($sdk.Split(' ')[0])"

      - name: Build Windows app
        run: dotnet build windows/Hako/Hako.csproj -c Debug -p:Platform=x64

      - name: Run tests
        run: dotnet test windows/Hako.Tests/Hako.Tests.csproj -c Debug

  server:
    runs-on: ubuntu-latest
    env:
      HAKO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hako_auth_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Create isolated server test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE hako_auth_test' \
            -c 'CREATE DATABASE hako_pack_test'

      - name: Check formatting
        run: cargo fmt --check
        working-directory: server

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: server

      - name: Run tests
        run: cargo test --workspace --locked
        working-directory: server

      - name: Run Pack PostgreSQL integration tests
        env:
          HAKO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hako_pack_test
        run: cargo test --locked --package hako-pack --test postgres_pack
        working-directory: server

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run release script tests
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py'

  version-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Require platform version bumps
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          base="$(git merge-base "$BASE_SHA" "$GITHUB_SHA")"
          python .github/scripts/detect_release.py --before "$base" --after "$GITHUB_SHA" --require-bump
