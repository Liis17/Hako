# Hako landing page: static files from site/dist copied to /var/www/hako.liis17.com.
# Certificates are expected from certbot (Let's Encrypt); adjust the paths if they differ.

server {
    listen 80;
    listen [::]:80;
    server_name hako.liis17.com;

    location /.well-known/acme-challenge/ {
        root /var/www/hako.liis17.com;
    }

    location / {
        return 301 https://hako.liis17.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hako.liis17.com;

    ssl_certificate     /etc/letsencrypt/live/hako.liis17.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hako.liis17.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hako_ssl:10m;
    ssl_session_timeout 1d;

    root /var/www/hako.liis17.com;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.github.com https://piston-meta.mojang.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.github.com https://piston-meta.mojang.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # CSS and JS names contain a content hash (see site/build.sh).
    location ~* ^/(styles|script)\.[0-9a-f]+\.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
